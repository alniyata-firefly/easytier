global:
  scrape_interval: 15s
  scrape_timeout: 10s
scrape_configs:
  - job_name: easytier
    honor_labels: true
    authorization:
      type: Bearer
      credentials_file: /etc/easytier/collector.token
    http_sd_configs:
      - url: http://127.0.0.1:11211/api/metrics/discovery
        authorization:
          type: Bearer
          credentials_file: /etc/easytier/collector.token
