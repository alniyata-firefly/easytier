name: Build packages

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**/*.md'
      - 'docs/images/**'
      - '.github/upstream-workflows/**'
  workflow_dispatch:
    inputs:
      linux:
        description: Build Linux x86_64 and ARM64 Core, CLI and Web
        type: boolean
        default: true
      gui:
        description: Build Windows x64 and macOS Intel/Apple Silicon clients
        type: boolean
        default: true
      android:
        description: Build signed Android ARM64 APK (requires four signing secrets)
        type: boolean
        default: true
      macos-sign:
        description: Use configured Apple signing and notarization credentials
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      linux: ${{ steps.plan.outputs.linux }}
      gui: ${{ steps.plan.outputs.gui }}
      android: ${{ steps.plan.outputs.android }}
      platforms: ${{ steps.plan.outputs.platforms }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate requested packages and signing configuration
        id: plan
        env:
          WANT_LINUX: ${{ github.event_name != 'workflow_dispatch' || inputs.linux }}
          WANT_GUI: ${{ github.event_name != 'workflow_dispatch' || inputs.gui }}
          WANT_ANDROID: ${{ github.event_name != 'workflow_dispatch' || inputs.android }}
          HAS_ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          HAS_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
          HAS_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS != '' }}
          HAS_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD != '' }}
        run: python3 ci/plan_packages.py

  web:
    needs: [plan, checks]
    uses: ./.github/workflows/build-web.yml

  checks:
    needs: plan
    uses: ./.github/workflows/checks.yml

  linux:
    needs: [plan, web]
    if: needs.plan.outputs.linux == 'true'
    uses: ./.github/workflows/build-linux.yml

  gui:
    needs: [plan, checks]
    if: needs.plan.outputs.gui == 'true'
    uses: ./.github/workflows/build-gui.yml
    with:
      macos-sign: ${{ github.event_name == 'workflow_dispatch' && inputs.macos-sign }}
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  android:
    needs: [plan, checks]
    if: needs.plan.outputs.android == 'true'
    uses: ./.github/workflows/build-android.yml
    secrets:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

  collect:
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' && needs.checks.result == 'success' && needs.web.result == 'success' &&
      !contains(needs.*.result, 'failure')
    needs: [plan, checks, web, linux, gui, android]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: downloaded-packages
          pattern: '{web-static,linux-*,gui-*,android-arm64}'
      - name: Verify all package hashes and the common source commit
        env:
          EXPECTED_PLATFORMS: ${{ needs.plan.outputs.platforms }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          command = ['python3', 'ci/artifacts.py', 'collect', '--input', 'downloaded-packages', '--output', 'release-assets']
          for platform in json.loads(os.environ['EXPECTED_PLATFORMS']):
              command.extend(['--platform', platform])
          subprocess.run(command, check=True)
          PY
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          overwrite: true
          name: release-packages
          path: release-assets/
          if-no-files-found: error
          retention-days: 14
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-packages
          path: release-assets
      - name: Publish verified packages for a version tag
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ github.ref_name == 'v2.7.2' || startsWith(github.ref_name, 'v2.7.2-') || startsWith(github.ref_name, 'v2.7.2+') }}
          make_latest: ${{ (github.ref_name == 'v2.7.2' || startsWith(github.ref_name, 'v2.7.2-') || startsWith(github.ref_name, 'v2.7.2+')) && 'false' || 'legacy' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: release-assets/*
