name: 功能请求 / Feature request
title: '[feat] '
description: 建议本分支改进 / Suggest an improvement to this fork
body:
  - type: markdown
    attributes:
      value: |
        请先搜索[本分支已有问题](https://github.com/alniyata-firefly/easytier/issues)，并说明你使用的版本。请勿附带凭据或私有部署数据。
        Search [this fork's issues](https://github.com/alniyata-firefly/easytier/issues) first and identify your version. Do not include credentials or private deployment data.
  - type: dropdown
    id: component
    attributes:
      label: 范围 / Scope
      options:
        - React Web 控制台 / React Web console
        - 桌面或 Android GUI / Desktop or Android GUI
        - Core 网络连接 / Core networking
        - 配置和 API / Configuration and APIs
        - 指标或日志 / Metrics or logs
        - 构建或平台支持 / Build or platform support
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: use-case
    attributes:
      label: 使用场景 / Use case
      description: 你想完成什么，当前版本的具体行为是什么？ / What are you trying to accomplish, and how does the current version behave?
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: 建议行为 / Proposed behavior
      description: 说明用户操作、配置或 API 的变化，以及预期结果。 / Describe changes to user actions, configuration, or APIs and the expected result.
    validations:
      required: true
  - type: textarea
    id: compatibility
    attributes:
      label: 兼容性和限制 / Compatibility and constraints
      description: 如已知，请说明受影响平台、旧配置迁移、网络内版本兼容、启动停止或断网恢复。 / If known, describe platforms, configuration migration, mixed-version compatibility, start/stop, or reconnection behavior.
  - type: textarea
    id: alternatives
    attributes:
      label: 其他方案 / Alternatives
      description: 已经尝试的配置、临时措施或参考资料。 / Configuration already tried, workarounds, or references.
