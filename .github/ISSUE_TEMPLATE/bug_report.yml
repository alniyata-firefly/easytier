name: 问题报告 / Bug report
title: '[bug] '
description: 报告本分支的问题 / Report a problem in this fork
body:
  - type: markdown
    attributes:
      value: |
        请先搜索[本分支已有问题](https://github.com/alniyata-firefly/easytier/issues)。请勿提交令牌、密码、私钥、完整数据库或未脱敏的截图。
        Search [this fork's issues](https://github.com/alniyata-firefly/easytier/issues) first. Remove tokens, passwords, private keys, databases, and private details from attachments.

        疑似漏洞请先阅读[安全策略](https://github.com/alniyata-firefly/easytier/security/policy)，不要在此公开利用细节。
        For suspected vulnerabilities, follow the [security policy](https://github.com/alniyata-firefly/easytier/security/policy) instead of posting exploit details here.
  - type: dropdown
    id: component
    attributes:
      label: 组件 / Component
      options:
        - React Web 控制台 / React Web console
        - Web 管理后端 / Management backend
        - Windows 或 macOS GUI / Windows or macOS GUI
        - Android 客户端 / Android client
        - Core 或 CLI / Core or CLI
        - 构建或安装 / Build or installation
        - 其他 / Other
    validations:
      required: true
  - type: textarea
    id: versions
    attributes:
      label: 版本和环境 / Versions and environment
      description: 分别提供 GUI、Core、服务端版本或提交，以及操作系统和安装来源。 / Include GUI, Core, and server versions or commits, OS, and package source.
      placeholder: |
        GUI / Core / Server:
        Commit / Package source:
        OS and version:
        Connection: Wi-Fi / mobile data / wired; IPv4 / IPv6 / NAT
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤 / Steps to reproduce
      description: 注明本地、远程或系统服务模式，以及客户端启动、停止、切后台或切网的顺序。 / Include local, remote, or service mode and the order of start, stop, backgrounding, or network changes.
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: 预期和实际结果 / Expected and actual results
      description: 说明具体行为、错误文字和发生时间，区分界面状态与实际连接。 / Describe behavior, error text, and timing; distinguish UI status from actual connectivity.
    validations:
      required: true
  - type: textarea
    id: redacted-evidence
    attributes:
      label: 脱敏配置和证据 / Redacted configuration and evidence
      description: 仅提供相关最小配置、日志或截图；可用固定占位符替换私有地址和标识。没有证据可说明。 / Provide relevant minimal config, logs, or screenshots. Replace private addresses and identifiers with consistent placeholders; explain if unavailable.
      placeholder: |
        network_secret = "<redacted>"
        config_server = "udp://example.invalid:22020/<redacted-token>"

        Relevant error only; no runtime database or credential-bearing URL.
  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息 / Additional context
      description: 是否能重复、首次出现版本、已经尝试的措施。 / Frequency, first affected version, and workarounds already tried.
