name: Setup adapted frontend
description: Install the locked workspace dependencies without building unrelated applications
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      with:
        version: 10.12.4
        run_install: false
    - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
      with:
        node-version: '22'
        cache: pnpm
        cache-dependency-path: pnpm-lock.yaml
    - name: Use one pnpm version throughout the workspace
      shell: bash
      run: |
        echo 'npm_config_manage_package_manager_versions=false' >> "$GITHUB_ENV"
        echo 'npm_config_package_manager_strict=false' >> "$GITHUB_ENV"
    - name: Install locked dependencies
      shell: bash
      env:
        npm_config_manage_package_manager_versions: 'false'
        npm_config_package_manager_strict: 'false'
      run: pnpm install --frozen-lockfile
